apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pcg-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: parkchargego.link
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pcg-app-service
                port:
                  number: 8080